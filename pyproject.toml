[project]
name = "sparse-delta"
version = "0.1.0"
description = "Sparse, smooth, locally-triggered multi-fidelity correction for ML interatomic potentials."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "nequip",
    "nequip-allegro",
    "sparse-delta-core",
    "cuequivariance-ops-torch-cu12>=0.10.0",
    "cuequivariance-torch>=0.10.0",
    "torch==2.9.0",
    "wandb>=0.26.0",
    "setuptools<81",
]

[tool.uv.workspace]
members = [
    "software/nequip-private",
    "software/allegro-private",
    "software/sparse-delta-core",
]

[tool.uv.sources]
nequip = { workspace = true, editable = true }
nequip-allegro = { workspace = true, editable = true }
sparse-delta-core = { workspace = true, editable = true }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
