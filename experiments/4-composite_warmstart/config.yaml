# 4-composite_warmstart
#
# First training run of the from-scratch warm-start composite per
# notes/m1_warmstart_design.md.
#
# M0 and M1 are both fresh Allegro_Modules; M1's tensor_features_in_field
# is aliased to M0's _allegro_pre_final_tp_out, so M1 inherits M0's
# pre-final TP output as its strided tensor input. Joint training of
# M0 + gate + M1; nothing is frozen.

# === fixed hparams ===
common_seed: 217
cutoff_radius: 5.0

# Gate
gate_function: sigmoid          # swap to "poly5" in a follow-up after λ_i calibration
gate_initial_lambda_mean: 0.05
sparsity_coeff: 0.1

# Training
batch_size: 4
grad_clip: 0.8
lr: 0.001
stop_delta: 0
lr_patience: 20
lr_factor: 0.8
early_stop_patience: 40        # medium-validation budget
target_max_epochs: 200         # medium-validation budget

# === paths ===
data_root: /n/netscratch/kozinsky_lab/Lab/demiranda/projects/sparse_delta/data/optb88/cameron_plus_bulkpt

# === hydra runtime directory ===
run_id: 4-composite_warmstart
project_root: /n/netscratch/kozinsky_lab/Lab/demiranda/projects/sparse_delta
hydra:
  run:
    dir: ${project_root}/runs/${run_id}

# === nequip top-level ===
run: [train, test]

monitor: val0_epoch/weighted_sum
chemical_symbols: [C, O, Pt]
model_type_names: ${chemical_symbols}

data:
  _target_: nequip.data.datamodule.ASEDataModule
  train_file_path: ${data_root}/split_train.xyz
  val_file_path: ${data_root}/split_val.xyz
  test_file_path: ${data_root}/split_test.xyz
  exclude_keys:
    - dipole
    - model_index

  seed: ${common_seed}
  transforms:
    - _target_: nequip.data.transforms.ChemicalSpeciesToAtomTypeMapper
      model_type_names: ${model_type_names}
    - _target_: nequip.data.transforms.NeighborListTransform
      r_max: ${cutoff_radius}

  train_dataloader:
    _target_: torch.utils.data.DataLoader
    batch_size: ${batch_size}
    num_workers: 4
    shuffle: true
  val_dataloader:
    _target_: torch.utils.data.DataLoader
    batch_size: ${batch_size}
    num_workers: ${data.train_dataloader.num_workers}
  test_dataloader: ${data.val_dataloader}

  stats_manager:
    _target_: nequip.data.CommonDataStatisticsManager
    dataloader_kwargs:
      batch_size: ${batch_size}
    type_names: ${model_type_names}

trainer:
  _target_: lightning.Trainer
  accelerator: gpu
  devices: 1
  num_nodes: 1
  enable_checkpointing: true
  gradient_clip_val: ${grad_clip}
  max_epochs: ${target_max_epochs}
  max_time: 01:00:00:00
  check_val_every_n_epoch: 1
  log_every_n_steps: 50

  logger:
    _target_: lightning.pytorch.loggers.wandb.WandbLogger
    project: sparse-delta
    entity: demiranda-gabriel
    name: ${run_id}
    group: 4-composite_warmstart
    save_dir: ${hydra:runtime.output_dir}

  callbacks:
    - _target_: lightning.pytorch.callbacks.ModelCheckpoint
      monitor: ${monitor}
      dirpath: ${hydra:runtime.output_dir}
      filename: best
      save_last: true

    - _target_: lightning.pytorch.callbacks.EarlyStopping
      monitor: ${monitor}
      min_delta: ${stop_delta}
      patience: ${early_stop_patience}

    - _target_: lightning.pytorch.callbacks.LearningRateMonitor
      logging_interval: epoch

training_module:
  _target_: nequip.train.NequIPLightningModule

  # Loss = E + F MSE + α · mean(λ) sparsity penalty.
  loss:
    _target_: nequip.train.EnergyForceLoss
    per_atom_energy: true
    coeffs:
      total_energy: 1.0
      forces: 1.0
    extra_metrics:
      - name: sparsity_penalty
        coeff: ${sparsity_coeff}
        metric:
          _target_: sparse_delta_core.train.GateMeanMetric

  val_metrics:
    _target_: nequip.train.EnergyForceMetrics
    coeffs:
      per_atom_energy_mae: 1.0
      forces_mae: 1.0
  train_metrics: ${training_module.val_metrics}
  test_metrics: ${training_module.val_metrics}

  optimizer:
    _target_: torch.optim.Adam
    lr: ${lr}

  lr_scheduler:
    scheduler:
      _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
      patience: ${lr_patience}
      factor: ${lr_factor}
      min_lr: 1e-6
    monitor: ${monitor}
    interval: epoch
    frequency: 1

  # === the warm-start composite ===
  # Wrapped by `nequip.model.modify` so the cuEquivariance contracter
  # swap-in happens after build. Modifier order matters: cuEquivariance
  # composes with `compile_mode: compile` (PT2) per
  # `software/allegro-private/docs/guide/cuequivariance.md`.
  model:
    _target_: nequip.model.modify
    modifiers:
      - modifier: enable_CuEquivarianceContracter
    model:
      _target_: sparse_delta_core.model.build_warmstart_composite
      # compile_mode: eager (NOT compile).
      # Bisect (jobs 13687384 / 13687385): PT2 compile reproducibly NaNs
      # in CompiledFunctionBackward's 8th output around epoch 8-15 with
      # this composite, regardless of cuEquivariance. Eager + cuEquivariance
      # (B1, run 8mjd3yhz) trained 30 epochs stably; compile + no-cueq
      # (B2, job 13687385) NaN'd identically to v1/v2. Keep cuEquivariance
      # active via the modifier above for its runtime contracter swap.
      compile_mode: eager
      # @model_builder requires these three. nequip-train normally
      # injects them via _CURRENT_MODEL_BUILDER_DEFAULTS, but the
      # outer `nequip.model.modify` wrapper breaks that propagation,
      # so spell them out here.
      seed: ${common_seed}
      model_dtype: float32

      r_max: ${cutoff_radius}
      type_names: ${model_type_names}

      # M0 — small foundation, runs everywhere
      m0_radial_chemical_embed:
        _target_: allegro.nn.TwoBodyBesselScalarEmbed
        num_bessels: 8
        bessel_trainable: false
        polynomial_cutoff_p: 6
      m0_radial_chemical_embed_dim: 128
      m0_l_max: 2
      m0_parity: true
      m0_num_layers: 2
      m0_num_scalar_features: 32
      m0_num_tensor_features: 16
      m0_allegro_mlp_hidden_layers_width: 64
      m0_readout_mlp_hidden_layers_width: 32

      # M1 — larger, gated correction, strictly local
      m1_num_layers: 1
      m1_num_scalar_features: 128
      m1_num_tensor_features: 16          # must match M0 in v1
      m1_allegro_mlp_hidden_layers_width: 128
      m1_readout_mlp_hidden_layers_width: 64

      # Gate
      gate_edge_hidden_dim: 64
      gate_node_hidden_dim: 64
      gate_node_hidden_depth: 2
      gate_function: ${gate_function}
      gate_initial_lambda_mean: ${gate_initial_lambda_mean}

      avg_num_neighbors: 30.0             # placeholder; real value comes from stats_manager at training time
      do_derivatives: true
