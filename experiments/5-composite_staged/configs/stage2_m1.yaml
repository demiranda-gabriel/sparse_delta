# 5-composite_staged / stage2_m1
#
# Stage 2: build the warm-start composite with gate_mode=constant
# (lambda=1.0 everywhere), load M0 weights from stage 1, freeze M0,
# train adapter + M1.
#
# Pre-requisite: stage 1 must have produced stage1_weights.pt at
# ${stage1_weights_path}. The submit_all.sh chain runs
# extract_model_weights.py between stages.

defaults:
  - base
  - _self_

# === stage-specific hparams ===
lr: 0.0005
target_max_epochs: 200
early_stop_patience: 40
run_id: 5-composite_staged-stage2_m1

# Where to find stage 1's extracted weights.
stage1_weights_path: ${stage_root}/stage1_m0/stage1_weights.pt

# === hydra runtime directory ===
hydra:
  run:
    dir: ${stage_root}/${run_id}

trainer:
  _target_: lightning.Trainer
  accelerator: gpu
  devices: 1
  num_nodes: 1
  enable_checkpointing: true
  gradient_clip_val: ${grad_clip}
  max_epochs: ${target_max_epochs}
  max_time: 01:00:00:00
  check_val_every_n_epoch: 1
  log_every_n_steps: 50

  logger:
    _target_: lightning.pytorch.loggers.wandb.WandbLogger
    project: sparse-delta
    entity: demiranda-gabriel
    name: ${run_id}
    group: 5-composite_staged
    save_dir: ${hydra:runtime.output_dir}

  callbacks:
    - _target_: lightning.pytorch.callbacks.ModelCheckpoint
      monitor: ${monitor}
      dirpath: ${hydra:runtime.output_dir}
      filename: best
      save_last: true

    - _target_: lightning.pytorch.callbacks.EarlyStopping
      monitor: ${monitor}
      min_delta: ${stop_delta}
      patience: ${early_stop_patience}

    - _target_: lightning.pytorch.callbacks.LearningRateMonitor
      logging_interval: epoch

    # --- stage-2 specific: load M0 weights from stage 1, freeze M0. ---
    - _target_: sparse_delta_core.train.LoadWeightsCallback
      weights_path: ${stage1_weights_path}
      strict: false
      # M0 standalone has ~22 state-dict entries (params + buffers).
      # Threshold at 15 — catches typo'd prefix while leaving headroom
      # for arch changes that drop a few buffers.
      require_load_count: 15

    - _target_: sparse_delta_core.train.FreezeByNameCallback
      patterns:
        - m0_
      # M0 has ~15 trainable parameters (state-dict entries include
      # buffers, but FreezeByName only counts ``named_parameters()``).
      require_freeze_count: 10

# === training module: warm-start composite, constant gate ===
training_module:
  _target_: nequip.train.NequIPLightningModule

  # No sparsity term — the gate is constant, mean(λ) is trivially 1.0
  # by construction.
  loss:
    _target_: nequip.train.EnergyForceLoss
    per_atom_energy: true
    coeffs:
      total_energy: 1.0
      forces: 1.0

  val_metrics:
    _target_: nequip.train.EnergyForceMetrics
    coeffs:
      per_atom_energy_mae: 1.0
      forces_mae: 1.0
  train_metrics: ${training_module.val_metrics}
  test_metrics: ${training_module.val_metrics}

  optimizer:
    _target_: torch.optim.Adam
    lr: ${lr}
    # Skip optimizer state for the frozen M0 block.
    param_groups:
      _target_: sparse_delta_core.train.trainable_param_group

  lr_scheduler:
    scheduler:
      _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
      patience: ${lr_patience}
      factor: ${lr_factor}
      min_lr: 1e-6
    monitor: ${monitor}
    interval: epoch
    frequency: 1

  model:
    _target_: nequip.model.modify
    modifiers:
      - modifier: enable_CuEquivarianceContracter
    model:
      _target_: sparse_delta_core.model.build_warmstart_composite
      compile_mode: eager
      seed: ${common_seed}
      model_dtype: float32
      r_max: ${cutoff_radius}
      type_names: ${model_type_names}

      m0_radial_chemical_embed: ${m0_radial_chemical_embed}
      m0_radial_chemical_embed_dim: ${m0_radial_chemical_embed_dim}
      m0_l_max: ${m0_l_max}
      m0_parity: ${m0_parity}
      m0_num_layers: ${m0_num_layers}
      m0_num_scalar_features: ${m0_num_scalar_features}
      m0_num_tensor_features: ${m0_num_tensor_features}
      m0_allegro_mlp_hidden_layers_width: ${m0_allegro_mlp_hidden_layers_width}
      m0_readout_mlp_hidden_layers_width: ${m0_readout_mlp_hidden_layers_width}

      m1_l_max: ${m1_l_max}
      m1_parity: ${m1_parity}
      m1_num_layers: ${m1_num_layers}
      m1_num_scalar_features: ${m1_num_scalar_features}
      m1_num_tensor_features: ${m1_num_tensor_features}
      m1_allegro_mlp_hidden_layers_width: ${m1_allegro_mlp_hidden_layers_width}
      m1_readout_mlp_hidden_layers_width: ${m1_readout_mlp_hidden_layers_width}

      # Constant gate at λ=1: every atom gets full M1 correction. M1
      # learns the full-strength residual; stage 3 then learns where
      # to dial it back via the learned gate.
      gate_mode: constant
      gate_constant_value: 1.0

      avg_num_neighbors: ${avg_num_neighbors_default}
      do_derivatives: true
